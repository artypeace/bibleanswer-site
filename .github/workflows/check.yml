name: check

# The pages are generated by tools/build.py and committed. This job fails if the committed pages are not
# what the sources produce, or if a link, a tag or an image the pages name is missing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the pages
        run: python3 tools/build.py
      - name: The committed pages are the built ones
        run: git diff --exit-code
      - name: Check tags, links, images, sitemap
        run: python3 tools/check.py
